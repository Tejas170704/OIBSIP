
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TempConvert – Temperature Converter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h1>TempConvert</h1>
    <p>Convert temperatures easily</p>

    <label for="temperature">Enter Temperature</label>
    <input type="number" id="temperature" placeholder="Enter a value" step="any">

    <label for="fromUnit">Convert From</label>
    <select id="fromUnit">
        <option value="C">Celsius (°C)</option>
        <option value="F">Fahrenheit (°F)</option>
        <option value="K">Kelvin (K)</option>
    </select>

    <label for="toUnit">Convert To</label>
    <select id="toUnit">
        <option value="F">Fahrenheit (°F)</option>
        <option value="C">Celsius (°C)</option>
        <option value="K">Kelvin (K)</option>
    </select>

    <button id="convertBtn">Convert Temperature</button>

    <div id="result" aria-live="polite">Your result will appear here.</div>
</div>

<script src="script.js"></script>
</body>
</html>
